<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ direction }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" href="/static/logo.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/theme.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="login-logo">
        <img src="/static/logo.png" alt="Zefira" width="64" height="64" class="logo-round">
        <h1 data-brand>ZEFIRA</h1>
        <p data-i18n="login.subtitle">Multi-Protocol Proxy Sales Panel</p>
      </div>
      <label class="field">
        <span data-i18n="login.username">Username</span>
        <input type="text" name="username" minlength="3" maxlength="64" required autofocus spellcheck="false">
      </label>
      <label class="field">
        <span data-i18n="login.password">Password</span>
        <input type="password" name="password" minlength="8" maxlength="128" required>
      </label>
      <div id="login-error" class="login-error" role="alert"></div>
      <button type="submit" id="login-btn" class="btn btn-primary btn-block" data-i18n="login.signin">Sign in</button>
      <p class="login-foot"><span data-brand>ZEFIRA</span> <span data-i18n="login.foot">PANEL © 2026 — Secured Connection</span></p>
      <div class="login-lang"><span id="lang-mount-login"></span></div>
    </form>
  </main>
  <script src="/static/i18n.js?v={{ asset_v }}" defer></script>
  <script src="/static/auth.js?v={{ asset_v }}" defer></script>
</body>
</html>
